# Nginx : sert le prototype CheckHub sur un sous-domaine.
# Remplacer checkhub.example.com par votre sous-domaine, puis :
#   sudo cp deploy/nginx-checkhub.conf /etc/nginx/sites-available/checkhub
#   sudo ln -s /etc/nginx/sites-available/checkhub /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d checkhub.example.com     # HTTPS (Let's Encrypt)

server {
    listen 80;
    listen [::]:80;
    server_name checkhub.example.com;

    root /var/www/checkhub;
    index index.html;

    # Accès protégé par mot de passe (recommandé pour un prototype interne).
    # Créer le fichier : sudo htpasswd -c /etc/nginx/.htpasswd-checkhub equipe
    # puis décommenter les deux lignes suivantes.
    # auth_basic "CheckHub - prototype";
    # auth_basic_user_file /etc/nginx/.htpasswd-checkhub;

    # Fichiers générés par Vite (nom avec empreinte) : cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Application monopage : toujours renvoyer index.html, sans cache
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
}
