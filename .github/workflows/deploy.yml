# Construit le prototype (web/) à chaque push, puis :
#  1. publie le site prêt à servir sur la branche `site` (récupérée par Plesk > Git) ;
#  2. (facultatif) le copie aussi en SSH sur un serveur, si le secret VPS_HOST existe.
#
# Secrets facultatifs pour l'option SSH (GitHub > Settings > Secrets and variables > Actions) :
#   VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PATH, VPS_PORT (22 par défaut), VPS_KNOWN_HOSTS
name: Déploiement

on:
  push:
    branches: [main, claude/elegant-maxwell-ih2pz3]
    paths: ['web/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: write # nécessaire pour pousser la branche `site`

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Construire
        run: npm run build

      - name: Publier sur la branche `site`
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cd dist
          git init -q -b site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site construit depuis ${SOURCE_SHA}"
          git push -f -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
          echo "Branche site mise à jour depuis ${SOURCE_SHA}"

      - name: Préparer SSH
        if: env.VPS_HOST != ''
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$PORT" "$VPS_HOST" > ~/.ssh/known_hosts
          fi

      - name: Copier sur le serveur (SSH)
        if: env.VPS_HOST != ''
        env:
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
          DEST: ${{ secrets.VPS_PATH }}
        run: |
          test -n "$DEST" || { echo "Secret VPS_PATH manquant"; exit 1; }
          rsync -az --delete --exclude .git -e "ssh -i ~/.ssh/id_deploy -p $PORT" dist/ "$USER@$VPS_HOST:$DEST/"
